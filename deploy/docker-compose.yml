#version: '3.8'
services:
  #BDD (POSTGRES O MYSQL)
  db:
    image: postgres:15
    container_name: fixmanager_pgsql_db
    #restart: always #para que se reinicie simpre por cualquier motivo ideal para producción
    environment:
      POSTGRES_USER: postgres #${POSTGRES_USER}         # Usuario default de postgres
      POSTGRES_PASSWORD: P@sswordM@ster2025*#  #${POSTGRES_PASSWORD} # Contraseña para usuario default de postgres
      POSTGRES_DB: postgres #${POSTGRES_DB}             # BDD defualt postgres
      
      # 3. Método de autenticación (recomendado para producción)
      #POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      #MYSQL
      #MYSQL_ROOT_PASSWORD: esteban83
      #MYSQL_DATABASE: fixmanager
      #MYSQL_USER: fixmanager
      #MYSQL_PASSWORD: esteban83
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups  # Aquí montas la carpeta local "backups"
      - ./initdb/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  backup:
    build:
      context: ../backups
      dockerfile: Dockerfile.backup
    container_name: fixmanager_backup
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - ../backups:/backups
    depends_on:
      - db

  backend:
    build: 
      context: ../backend            # El contexto es la carpeta que contiene el Dockerfile
      dockerfile: Dockerfile.dev
    container_name: fixmanager-backend
    #restart: always #para que se reinicie simpre por cualquier motivo ideal para producción
    ports:
      - "8088:8080" #"<puerto_host>:<puerto_contenedor>"
    volumes:
      - ../backend/fixmanager:/app   # Monta solo el codigo fuente que esta en la carpeta
      #- ./backend:/app
      - ~/.m2:/root/.m2             # CACHE MAVEN
    working_dir: /app
    env_file: ../.env   # Asumiendo que se ejecuta desde FIXMANAGER/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${APP_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
     - db  

  frontend:
    build:
      context: ../frontend #RUTA RELATIVA AL SUBMODULO FRONTEND REACT
      dockerfile: Dockerfile.dev
    container_name: fixmanager-frontend
    #restart: always #para que se reinicie simpre por cualquier motivo ideal para producción
    ports:
      #- "19000:19000"                          # Puerto de Expo CLI
      #- "19001:19001"                          # WebSocket debugger
      #- "19002:19002"                          # Expo Dev Tools
      #- "19005:19005"                          # Web en modo normal (web fallback)
      #- "19006:19006"                          # Puerto del bundler
      #- "3000:3000"                             # Puerto para web
      #- "8081:8081"                            # Si se expone
      - "5173:5173"                            # Puerto si se usa VITE
    volumes:
      - ../frontend/fixmanager:/app             # Montamos directamente el proyecto en /app
      - /app/node_modules                       # Evita sobrescribir node_modules locales
    working_dir: /app
    env_file: ../.env
    environment:
    - CHOKIDAR_USEPOLLING=true                 # Necesario si hot-reload no funciona
    #- EXPO_PUBLIC_HOST=0.0.0.0
    #- EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    #- EXPO_USE_DEV_SERVER=true
    #  - EXPO_PUBLIC_API_URL=http://backend:8080  # URL de tu API
    #  - EXPO_PUBLIC_API_URL_EXTERNAL=http://${HOST_IP}:8080  # Para móviles
    #  - CHOKIDAR_USEPOLLING=true  # Para hot-reload en Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"     # Necesario en Linux 
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend

volumes:
  db_data: